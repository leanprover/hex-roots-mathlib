name = "hex-roots-mathlib"
defaultTargets = ["HexRootsMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRoots"
git = "https://github.com/leanprover/hex-roots.git"
rev = "78f2653c2dcb25eba8450858529490a1704d632e"

[[require]]
name = "HexPolyZMathlib"
git = "https://github.com/leanprover/hex-poly-z-mathlib.git"
rev = "781fcf515411217c4e03e4f607ce8a84ef818bcb"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexRootsMathlib"

[[lean_lib]]
name = "HexRootsMathlibTests"
globs = ["HexRootsMathlib.Examples"]
